<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=3">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png?v=3">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png?v=3">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Custom Styles -->
    <style>
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-100%); opacity: 0; }
        }
        .toast {
            animation: slideIn 0.3s ease-out;
        }
        .toast.hide {
            animation: slideOut 0.3s ease-in;
        }
        .unsaved-indicator {
            color: #fbbf24;
            font-weight: bold;
            margin-left: 0.25rem;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100">

    <!-- ================= TOAST NOTIFICATIONS ================= -->
    <div id="toastContainer" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 max-w-sm pointer-events-none"></div>

    <!-- ================= DELETE CONFIRMATION MODAL ================= -->
    <div id="deleteConfirmModal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl p-6 max-w-sm border border-slate-700">
            <h2 class="text-lg font-bold mb-2">Delete note?</h2>
            <p class="text-slate-300 mb-6">This action cannot be undone.</p>
            <div class="flex gap-3 justify-end">
                <button id="confirmDeleteCancel" class="px-4 py-2 rounded-xl border border-slate-600 hover:bg-slate-700">Cancel</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500">Delete</button>
            </div>
        </div>
    </div>

    <!-- ================= HEADER ================= -->

    <header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-900">

        <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-5">

            <h1 class="text-2xl font-bold flex items-center gap-2.5">
                <img src="assets/icons/icon-192.png?v=3" alt="Notes Logo" class="h-8 w-8 object-contain rounded-lg">
                <span>Notes</span>
            </h1>

            <div class="flex items-center gap-3">

                <input id="searchInput" type="text" placeholder="Search notes..."
                    class="hidden lg:block w-72 rounded-xl border border-slate-700 bg-slate-800 px-4 py-2 outline-none focus:border-blue-500">

                <button id="newNoteBtn"
                    class="hidden lg:flex items-center rounded-xl bg-blue-600 px-5 py-2 hover:bg-blue-500">

                    + New Note

                </button>

            </div>

        </div>

    </header>

    <!-- ================= DESKTOP ================= -->

    <main class="hidden lg:grid lg:grid-cols-[340px_1fr] h-[calc(100vh-64px)] max-w-7xl mx-auto">

        <!-- Sidebar -->

        <aside class="border-r border-slate-800 flex flex-col">

            <div class="p-4 border-b border-slate-800">

                <h2 class="font-semibold">
                    Your Notes
                </h2>

            </div>

            <div class="p-4 border-b border-slate-800">

                <div class="flex items-center justify-between">

                    <h3 class="font-semibold">

                        Categories

                    </h3>

                    <button id="addCategoryBtn" class="text-blue-400 hover:text-blue-300">

                        +

                    </button>

                </div>

                <div id="categoriesContainer" class="mt-4 space-y-2">

                </div>

            </div>

            <div id="notesListDesktop" class="flex-1 overflow-y-auto">

            </div>

        </aside>

        <!-- Editor -->

        <section class="flex flex-col">

            <div class="flex-1 p-8 flex flex-col">

                <div class="flex items-start justify-between gap-4 mb-3">
                    <div class="flex-1">
                        <div class="flex items-center">
                            <input id="noteTitleDesktop" type="text" placeholder="Untitled"
                                class="text-4xl font-bold bg-transparent border-b border-slate-700 pb-3 outline-none placeholder:text-slate-600 w-full">
                            <span id="unsavedIndicatorDesktop" class="unsaved-indicator hidden">•</span>
                        </div>
                    </div>
                </div>

                <textarea id="noteContentDesktop" placeholder="Start writing..."
                    class="flex-1 mt-6 bg-transparent resize-none outline-none text-slate-300 placeholder:text-slate-600"></textarea>

                <div class="flex justify-end gap-3 mt-6">
                    <span id="saveStatusDesktop" class="text-sm text-slate-400 flex items-center gap-2">
                        <span id="saveSpinner" class="hidden">⏳</span>
                        <span id="saveMessage"></span>
                    </span>
                    <button id="saveBtnDesktop" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500">

                        Save

                    </button>

                </div>

            </div>

        </section>

    </main>

    <!-- ================= MOBILE ================= -->

    <main id="mobileView" class="lg:hidden">

        <!-- Notes List -->

        <section id="mobileListView" class="min-h-[calc(100vh-64px)]">

            <div class="p-4 border-b border-slate-800 space-y-3">

                <div class="flex flex-col gap-2">

                    <div class="flex items-center justify-between">
                        <p class="text-sm font-medium uppercase tracking-wide text-slate-400">
                            Category
                        </p>
                    </div>

                    <button id="mobileCategoryBtn" type="button"
                        class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-left text-slate-100 hover:border-blue-500">
                        General
                        <span class="float-right">▼</span>
                    </button>

                    <div id="mobileCategoryList" class="hidden rounded-xl border border-slate-700 bg-slate-900/95 py-2">
                    </div>

                </div>

                <input id="searchInputMobile" type="text" placeholder="Search notes..."
                    class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-2 outline-none focus:border-blue-500">

            </div>

            <div id="notesListMobile" class="divide-y divide-slate-800">

                <!-- Notes rendered here -->

            </div>

        </section>

        <!-- Editor -->

        <section id="mobileEditorView" class="hidden min-h-[calc(100vh-64px)] p-5 flex flex-col">
            <div class="flex items-center justify-between mb-6">
                <button id="backBtn" class="text-blue-400">
                    ← Back
                </button>
                <span id="unsavedIndicatorMobile" class="unsaved-indicator hidden">●</span>
            </div>

            <div class="flex items-center">
                <input id="noteTitleMobile" type="text" placeholder="Untitled"
                    class="text-3xl font-bold bg-transparent border-b border-slate-700 pb-3 outline-none flex-1">
            </div>

            <textarea id="noteContentMobile" placeholder="Start writing..."
                class="flex-1 mt-6 bg-transparent resize-none outline-none"></textarea>

            <div class="flex justify-between items-center gap-3 mt-6">

                <button id="deleteBtnMobile"
                    class="px-5 py-2 rounded-xl border border-red-700 text-red-400 hover:bg-red-900/30">

                    🗑

                </button>

                <div class="flex items-center gap-3">
                    <span id="saveStatusMobile" class="text-sm text-slate-400 flex items-center gap-2">
                        <span id="saveSpinnerMobile" class="hidden">⏳</span>
                        <span id="saveMessageMobile"></span>
                    </span>
                    <button id="saveBtnMobile" class="px-5 py-2 rounded-xl bg-blue-600">

                        Save

                    </button>
                </div>

            </div>

        </section>

    </main>

    <!-- Floating Button -->

    <button id="fab"
        class="fixed bottom-6 right-6 h-16 w-16 rounded-full bg-blue-600 text-4xl shadow-xl hover:bg-blue-500 lg:hidden">

        +

    </button>
    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="js/app.js?v=20260730-4"></script>

</body>

</html>
